25_pyro:
  sector:
    pyrolysis_multi-output:
      enable: true
    co2_sequestration_potential:
      2050: 25
25_NOpyro:
  sector:
    pyrolysis_multi-output:
      enable: false
    co2_sequestration_potential:
      2050: 25

5_pyro:
  sector:
    pyrolysis_multi-output:
      enable: true
    co2_sequestration_potential:
      2050: 5


25_Med-pyro:
  biomass:
    scenario: ENS_Med
  sector:
    pyrolysis_multi-output:
      enable: true
    co2_sequestration_potential:
      2050: 25
25_Med-NOpyro:
  biomass:
    scenario: ENS_Med
  sector:
    pyrolysis_multi-output:
      enable: false
    co2_sequestration_potential:
      2050: 25

